<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ghosts'n Goblins</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;background:#080c12;color:#e7edf4;
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
    font:14px/1.3 system-ui,sans-serif}
  #layout{display:flex;justify-content:center;position:relative;
    height:100dvh;padding:8px max(8px,env(safe-area-inset-right))
    8px max(8px,env(safe-area-inset-left));gap:8px}
  .side{display:flex;position:absolute;right:max(12px,env(safe-area-inset-right));
    top:max(12px,env(safe-area-inset-top));bottom:max(12px,env(safe-area-inset-bottom));
    width:clamp(126px,17vw,156px);flex-direction:column;align-items:center;
    justify-content:space-between;gap:10px;pointer-events:none;z-index:1}
  .side button{pointer-events:auto}
  #screen-wrap{display:flex;flex:0 1 calc((100dvh - 20px)*256/224);
    position:relative;align-items:center;min-width:0;
    justify-content:center;background:#000;border:1px solid #283440}
  canvas{display:block;width:100%;max-width:calc((100dvh - 20px)*256/224);aspect-ratio:256/224;
    image-rendering:pixelated;background:#000}
  button{font:inherit;font-weight:650;color:#e7edf4;background:#172330;
    border:1px solid #425465;border-radius:14px;min-height:46px;
    touch-action:none;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  button.held{background:#285c61;border-color:#87e1c9;color:#fff}
  /* Floating thumbstick: the base appears under the thumb anywhere in the
     zone; it rests at the bottom right while untouched. */
  #stick-zone{--r:clamp(40px,12dvh,58px);position:absolute;right:0;bottom:0;
    width:clamp(170px,36vw,340px);height:64dvh;touch-action:none;z-index:0}
  #stick-zone.disabled{opacity:.35}
  #stick-base,#stick-knob{position:absolute;left:0;top:0;border-radius:50%;
    pointer-events:none;will-change:transform}
  #stick-base{width:calc(var(--r)*2);height:calc(var(--r)*2);
    border:2px solid #87e1c940;background:radial-gradient(#17233000 55%,#17233066);
    opacity:.55;transition:opacity .12s}
  #stick-base::before,#stick-base::after{content:"";position:absolute;inset:18%;
    border:1px dashed #87e1c926;border-radius:50%}
  #stick-base::after{inset:48% 6%;border:0;border-top:1px solid #87e1c91f}
  #stick-knob{width:calc(var(--r)*.9);height:calc(var(--r)*.9);
    background:#87e1c933;border:2px solid #87e1c999;opacity:.6}
  #stick-zone.active #stick-base{opacity:1;border-color:#87e1c980}
  #stick-zone.active #stick-knob{opacity:1}
  #stick-zone[data-dir] #stick-knob{background:#285c61cc;border-color:#87e1c9}
  #stick-zone[data-dir^="up-"] #stick-knob{background:#5c4a28cc;border-color:#f8d582}
  #coin{border-color:#8d7845;color:#f8d582}
  #start{border-color:#5c9b8b;color:#a4ead6}
  #menu{display:flex;flex-direction:column;gap:10px;width:100%}
  #system-controls{display:flex;gap:6px;width:100%}
  #system-controls[hidden],#hint[hidden]{display:none}
  #system-controls button{flex:1;min-height:36px;font-size:12px;border-radius:10px}
  #button-stack{position:absolute;left:max(12px,env(safe-area-inset-left));
    bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
    gap:8px;width:clamp(76px,10vw,96px);background:transparent}
  #button-stack button{min-height:clamp(46px,13dvh,58px);padding:6px;
    border-radius:12px;font-size:13px;backdrop-filter:none}
  #attack{border-color:#c08558b3;background:#39291e55}
  #jump{border-color:#5e9eabb3;background:#1c303755}
  #button-stack button.held{background:#285c6199;border-color:#87e1c9;color:#fff}
  #restart,#ck-save,#ck-load{min-height:32px;padding:4px 10px;font-size:11px;
    color:#a7b9ca;background:transparent;border-color:#2e3d4b;border-radius:9px}
  #sound{min-height:34px;font-size:12px;border-radius:10px;background:transparent}
  #footer{display:flex;gap:6px;align-items:center;justify-content:space-between;
    width:100%;padding-top:6px}
  #hint{margin:0;text-align:center;font-size:12px;color:#acbdcc}
  #status{font:10px/1.6 ui-monospace,monospace;color:#8da899;
    white-space:nowrap;text-align:center}
  #halt{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;padding:20px;background:#090e13df;
    text-align:center;color:#ffd3b8}
  #halt[hidden]{display:none}
  @media(max-height:330px){.side{gap:5px}#menu{gap:5px}
    #status{font-size:9px}#hint{font-size:10px}}
</style>
</head>
<body>
<main id="layout">
  <div id="screen-wrap">
    <canvas id="screen" width="256" height="224" aria-label="Pantalla del juego"></canvas>
    <div id="halt" hidden role="alert"></div>
  </div>
  <div id="button-stack" role="group" aria-label="Acciones del juego">
    <button id="attack" data-hold="p1.button1" disabled>Disparo</button>
    <button id="jump" data-hold="p1.button2" disabled>Salto</button>
  </div>
  <section class="side" aria-label="Dirección y opciones">
    <div id="menu">
      <div id="system-controls" role="group" aria-label="Moneda e inicio">
        <button id="coin" data-pulse="coin1" disabled>Moneda</button>
        <button id="start" data-pulse="start1" disabled>Start</button>
      </div>
      <p id="hint">Cargando el juego…</p>
      <button id="sound" disabled aria-pressed="false"
        title="Preparando el sonido…">Sonido OFF</button>
      <div id="footer">
        <button id="restart">Reiniciar</button>
        <button id="ck-save" disabled title="Guardar checkpoint">Guardar</button>
        <button id="ck-load" disabled title="Sin checkpoint guardado">Cargar</button>
        <output id="status">cargando…</output>
      </div>
    </div>
  </section>
  <div id="stick-zone" class="disabled" role="group"
      aria-label="Dirección: apoyá el pulgar y arrastrá">
    <div id="stick-base"></div><div id="stick-knob"></div>
  </div>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
