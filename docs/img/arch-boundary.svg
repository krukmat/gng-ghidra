<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Private boundary. On the Mac the ROM feeds the build chain and out/. Patched MAME is used only as an oracle to capture a native reference; comparators run the bundle and read the reference at the end. GitHub gets code, ROM-free tests, input tapes and text markers only.">
<style>svg{--paper:#f1f4f2;--panel:#ffffff;--ink:#16201d;--ink-2:#4b5a55;--rule:#c4cec9;--grid:#edf1ef;--base:#1c5db3;--base-soft:#e6eefa;--game:#93570b;--game-soft:#f7ecdb;--ok:#23764a;--stop:#b0281f;--stop-soft:#fae6e3;--oracle:#6a707b;--screen:#0e1413;--screen-ink:#d6e2dd;--f-ui:"Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.dg text{font-family:var(--f-ui);font-size:13px;fill:var(--ink)}
.dg .t{font-size:13.5px;font-weight:650}
.dg .m{font-family:var(--f-mono);font-size:11px}
.dg .s{font-size:11.5px;fill:var(--ink-2)}
.dg .n{font-size:12.5px}
.dg .lbl{font-size:11px;fill:var(--ink-2)}
.dg .cap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;fill:var(--ink-2)}
.dg .b{font-weight:700}
.dg .tb{fill:var(--base)}
.dg .tg{fill:var(--game)}
.dg .tx{fill:var(--stop)}
.dg .to{fill:var(--oracle)}
.dg .scr{fill:var(--screen-ink)}
.dg .box{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.2}
.dg .box.b{fill:var(--base-soft);stroke:var(--base)}
.dg .box.g{fill:var(--game-soft);stroke:var(--game)}
.dg .box.x{fill:var(--stop-soft);stroke:var(--stop)}
.dg .box.o{fill:var(--panel);stroke:var(--oracle);stroke-dasharray:5 4}
.dg .box.k{stroke-width:2}
.dg .e{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.dg .e.b{stroke:var(--base);stroke-width:1.8}
.dg .e.g{stroke:var(--game);stroke-width:1.8}
.dg .e.x{stroke:var(--stop);stroke-width:1.6;stroke-dasharray:6 4}
.dg .e.o{stroke:var(--oracle);stroke-dasharray:5 4}
.dg .ah{fill:var(--ink-2)}
.dg .ah.b{fill:var(--base)}
.dg .ah.g{fill:var(--game)}
.dg .ah.x{fill:var(--stop)}
.dg .ah.o{fill:var(--oracle)}
.dg .zone{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:8 6}
.dg .gh{fill:none;stroke:var(--rule);stroke-width:1.5}
.dg .bus{stroke:var(--ink-2);stroke-width:3}
.dg .tick{stroke:var(--rule);stroke-width:1.2}
.dg .row{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.dg .row.v{fill:var(--base-soft)}
.dg .row.c{fill:var(--game-soft)}
.dg .frame{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.dg .screen{fill:var(--screen);stroke:var(--ink-2)}
.dg .sq-x{fill:var(--stop)}
.dg .sq-ok{fill:var(--ok)}</style>
<rect width="100%" height="100%" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1L10 5L0 9z"/></marker>
    <marker id="f-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah b" d="M0 1L10 5L0 9z"/></marker>
    <marker id="f-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah o" d="M0 1L10 5L0 9z"/></marker>
  </defs>

  <rect class="zone" x="16" y="16" width="1068" height="340" rx="14"/>
  <text class="cap" x="36" y="40">OPERATOR'S MAC · PRIVATE</text>
  <text class="s" x="36" y="58">roms/ and out/ stay out of Git.</text>

  <rect class="box k" x="36" y="84" width="160" height="70" rx="6"/>
  <text class="m b" x="116" y="110" text-anchor="middle">roms/&lt;game&gt;.zip</text>
  <text class="s" x="116" y="128" text-anchor="middle">the only source</text>
  <text class="s" x="116" y="144" text-anchor="middle">of game bytes</text>

  <text class="cap tb" x="256" y="78">PRODUCT</text>
  <rect class="box b" x="256" y="88" width="190" height="62" rx="6"/>
  <text class="t" x="351" y="113" text-anchor="middle">Build chain</text>
  <text class="m" x="351" y="131" text-anchor="middle">base/tools/migrate.mjs</text>
  <rect class="box b k" x="506" y="88" width="230" height="62" rx="6"/>
  <text class="t" x="621" y="113" text-anchor="middle">out/ · bundle · assets · APK</text>
  <text class="s" x="621" y="131" text-anchor="middle">derived from the ROM: private</text>
  <path class="e b" d="M196 119H256" marker-end="url(#f-ab)"/>
  <path class="e b" d="M446 119H506" marker-end="url(#f-ab)"/>

  <text class="cap to" x="256" y="200">ORACLE · COMPARISON ONLY</text>
  <rect class="box o" x="256" y="210" width="190" height="80" rx="6"/>
  <text class="t" x="351" y="236" text-anchor="middle">MAME 0.289</text>
  <text class="s" x="351" y="254" text-anchor="middle">patches + Lua recorder</text>
  <text class="s" x="351" y="270" text-anchor="middle">isolated cold run</text>
  <rect class="box o" x="506" y="210" width="230" height="80" rx="6"/>
  <text class="t" x="621" y="236" text-anchor="middle">Native reference</text>
  <text class="s" x="621" y="254" text-anchor="middle">per-cycle events · per-frame</text>
  <text class="s" x="621" y="270" text-anchor="middle">state · PNG · PCM</text>
  <path class="e o" d="M116 154V250H256" marker-end="url(#f-ao)"/>
  <path class="e o" d="M446 250H506" marker-end="url(#f-ao)"/>

  <rect class="box k" x="806" y="88" width="258" height="202" rx="6"/>
  <text class="t" x="822" y="114">Comparators</text>
  <text class="s" x="822" y="132">run the bundle without MAME;</text>
  <text class="s" x="822" y="148">open the reference at the end</text>
  <rect class="sq-ok" x="823" y="171" width="7" height="7"/>
  <text class="n" x="838" y="178">two runs match</text>
  <rect class="sq-ok" x="823" y="195" width="7" height="7"/>
  <text class="n" x="838" y="202">events on the same cycle</text>
  <rect class="sq-ok" x="823" y="219" width="7" height="7"/>
  <text class="n" x="838" y="226">state and pixels per frame</text>
  <rect class="sq-ok" x="823" y="243" width="7" height="7"/>
  <text class="n" x="838" y="250">input tapes → same hash</text>
  <text class="s" x="822" y="278">output: PASS / BLOCKED markers</text>
  <path class="e b" d="M736 119H806" marker-end="url(#f-ab)"/>
  <path class="e o" d="M736 250H806" marker-end="url(#f-ao)"/>
  <text class="lbl" x="771" y="242" text-anchor="middle">at the end</text>

  <text class="s" x="36" y="326">The APK is installed from here; it holds ROM bytes, so it is never published.</text>

    <path class="e" d="M935 290V384" marker-end="url(#f-a)"/>
  <text class="lbl" x="925" y="330" text-anchor="end">text markers</text>
  <text class="lbl" x="925" y="342" text-anchor="end">only</text>
  <path class="e" d="M116 384V356" marker-end="url(#f-a)"/>
  <text class="lbl" x="126" y="374">git pull</text>
  <rect class="gh" x="16" y="384" width="1068" height="100" rx="14"/>
  <text class="cap" x="36" y="408">GITHUB · THIS REPOSITORY, PUBLIC · NO ROM BYTES</text>
  <text class="m b" x="36" y="436">base/</text>
  <text class="s" x="36" y="454">pinned copy of the private base</text>
  <text class="m b" x="300" y="436">boards/ · games/ · src/</text>
  <text class="s" x="300" y="454">board, game, renderer</text>
  <text class="m b" x="564" y="436">tests/</text>
  <text class="s" x="564" y="454">synthetic fixtures, no ROM</text>
  <text class="m b" x="828" y="436">tapes · docs/</text>
  <text class="s" x="828" y="454">inputs only; markers</text>
</svg>
