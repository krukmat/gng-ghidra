name: POC checks (no ROM redistributed)
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tests/test_java_preflight.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/generate_synthetic.py
      - run: node --test tests/test_synthetic_js.mjs
      - run: node --test tests/test_generated.mjs
      - run: python3 tests/generate_function_fixtures.py
      - run: node --test tests/test_function_generated.mjs
      - run: node --test tests/test_guarded_execution_harness.mjs
      - run: node --test tests/test_mc6809_differential.mjs
      - run: node --test tests/test_indexed_mc6809_differential.mjs
      - run: node --test tests/test_r3_static_trace_probe.mjs
      - run: node --test tests/test_r3_sprite_native.mjs
      - run: node --test tests/test_r3_next_frontier.mjs
      - run: node --test tests/test_r3_sync_boundary.mjs
      - run: node --test tests/test_sprite_memory.mjs
      - run: node --test tests/test_video_memory.mjs
      - run: npm install --global typescript@5.9.3
      - run: tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution node out-synthetic/functions/generated/*.ts