name: Independent MC6809 oracle smoke
on:
  push:
    branches: [main]
    paths:
      - 'scripts/mc6809-native-oracle.cpp'
      - 'scripts/build-mc6809-oracle.sh'
      - '.github/workflows/mc6809-oracle-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned independent MC6809 CPU library
        run: bash scripts/build-mc6809-oracle.sh
      - name: CPU smoke test on ROM-free synthetic 6809 opcodes
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          out=pathlib.Path('out/native-oracle')
          memory=bytearray(65536)
          # 6809 genuine instructions: LDA $3003; COMA; STA <$40;
          # LDA $3004; COMA; STA <$41; RTS (not the game's ROM).
          code=bytes.fromhex('b63003439740b6300443974139')
          assert len(code)==13
          memory[0x622c:0x622c+len(code)]=code
          memory[0xfffe:0x10000]=bytes.fromhex('6000')
          image=out/'cpu-smoke-image.bin'
          image.write_bytes(memory)
          p=subprocess.run([
            str(out/'mc6809-reference'),str(image),
            '0x622c','0x13572468','0x200'],
            capture_output=True,text=True,timeout=10,check=True)
          a='GNG_NATIVE_BEGIN\n';b='\nGNG_NATIVE_END'
          assert a in p.stdout and b in p.stdout,p.stdout
          result=json.loads(p.stdout.split(a)[1].split(b)[0])
          assert result['entry']=='0x622c'
          assert result['steps']==7,result
          assert result['source_rts']==0x6238
          assert result['registers']['PC']==0x7000
          assert len(result['ioTrace'])==2
          assert [e['addr'] for e in result['ioTrace']]==[0x3003,0x3004]
          assert [e['value'] for e in result['ioTrace']]==[0x68,0x24]
          for change in result['ramChanges']:
            if change['addr']==0x40: assert change['after']==(0x68^255)
            if change['addr']==0x41: assert change['after']==(0x24^255)
          print('GNG_NATIVE_ORACLE_SMOKE=PASS steps=7 MMIO_reads=2 ROM=synthetic')
          # Separate synthetic NOP+store code covers all five whitelisted
          # MMIO writes and RTS. This is not game ROM differential evidence.
          image2=bytearray(65536)
          image2[0x6755:0x6772]=bytes([0x12])*(0x6772-0x6755)
          for pc,opcode,address in [
            (0x6759,0xf7,0x3d00),(0x675e,0xb7,0x3b09),
            (0x6761,0xf7,0x3b08),(0x676b,0xb7,0x3b0b),
            (0x676e,0xf7,0x3b0a)]:
            image2[pc:pc+3]=bytes([opcode,address>>8,address&255])
          image2[0x6771]=0x39  # RTS
          image2[0xfffe:0x10000]=bytes.fromhex('6000')
          image_path=out/'cpu-smoke-video.bin'
          image_path.write_bytes(image2)
          other=subprocess.run([
            str(out/'mc6809-reference'),str(image_path),
            '0x6755','0x31415926','0x1000'],
            capture_output=True,text=True,timeout=10,check=True)
          assert a in other.stdout and b in other.stdout,other.stdout
          observed=json.loads(other.stdout.split(a)[1].split(b)[0])
          assert observed['entry']=='0x6755'
          assert observed['steps']==19,observed
          assert observed['source_rts']==0x6771
          assert observed['registers']['PC']==0x7000
          assert observed['registers']['S']==0x1002
          events=observed['ioTrace']
          assert len(events)==5
          assert [e['pc'] for e in events]==[0x6759,0x675e,0x6761,0x676b,0x676e]
          assert [e['addr'] for e in events]==[0x3d00,0x3b09,0x3b08,0x3b0b,0x3b0a]
          A,B=observed['registers']['A'],observed['registers']['B']
          assert [e['value'] for e in events]==[B,A,B,A,B]
          assert all(e['kind']=='write' and e['size']==1 for e in events)
          assert not observed['ramChanges']
          print('GNG_NATIVE_ORACLE_BOARD_SMOKE=PASS steps=19 MMIO_writes=5 ROM=synthetic')
          # Indexed third routine, genuine 6809 LDA ,X; RTS (A6 84 39).
          # Additional native args specify byte-verified source RTS and
          # controlled X/Y/U initial value, without any board emulation.
          third=bytearray(65536)
          third[0x6239:0x623c]=bytes.fromhex('a68439')
          third[0xfffe:0x10000]=bytes.fromhex('6000')
          path3=out/'cpu-smoke-indexed.bin'
          path3.write_bytes(third)
          p3=subprocess.run([
            str(out/'mc6809-reference'),str(path3),
            '0x6239','0x13572468','0x200','0x623b','0x210'],
            capture_output=True,text=True,timeout=10,check=True)
          assert a in p3.stdout and b in p3.stdout,p3.stdout
          result3=json.loads(p3.stdout.split(a)[1].split(b)[0])
          assert result3['entry']=='0x6239'
          assert result3['steps']==2,result3
          assert result3['source_rts']==0x623b
          assert result3['return_address']==0x7000
          assert result3['index_initial']==0x210
          assert result3['registers']['PC']==0x7000
          assert result3['registers']['X']==0x210
          assert result3['registers']['Y']==0x210
          assert result3['registers']['U']==0x210
          assert result3['registers']['S']==0x202
          assert not result3['ioTrace']
          assert not result3['ramChanges']
          print('GNG_NATIVE_INDEXED_SMOKE=PASS steps=2 indexed_read=1 ROM=synthetic')
          # A genuine CPU I/O read in the third routine is always rejected.
          third[0x6239:0x623d]=bytes.fromhex('b6300339')
          path3.write_bytes(third)
          fail=subprocess.run([
            str(out/'mc6809-reference'),str(path3),
            '0x6239','0x13572468','0x200','0x623c','0x210'],
            capture_output=True,text=True,timeout=10)
          assert fail.returncode!=0 and 'unapproved I/O read' in fail.stderr
          print('GNG_NATIVE_INDEXED_UNKNOWN_MMIO=BLOCKED_AS_EXPECTED')
          PY
